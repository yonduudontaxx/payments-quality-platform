name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test

jobs:
  build-and-unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Run migrations
        run: npm run migrate
      - name: Unit tests
        run: npm run test:unit
      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-jest-unit
          path: allure-results/jest
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Integration tests
        run: npm run test:integration
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-jest-integration
          path: allure-results/jest
          if-no-files-found: ignore

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run migrations
        run: npm run migrate
      - name: Build
        run: npm run build
      - name: Start server
        run: node dist/server.js > server.log 2>&1 &
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000/webhooks/config --timeout 60000
      - name: E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Server logs on failure
        if: failure()
        run: cat server.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-playwright
          path: allure-results/playwright
          if-no-files-found: ignore

  report:
    name: Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-unit, integration, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download jest results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-jest-*
          path: allure-results/jest
          merge-multiple: true
        continue-on-error: true
      - name: Download E2E results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-playwright
          path: allure-results/playwright
          merge-multiple: true
        continue-on-error: true
      - name: Generate Allure report
        run: |
          mkdir -p allure-results/jest allure-results/playwright
          npm run report:generate
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore
