name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_ENV: test

jobs:
  build-and-unit:
    name: Build & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tests_ran: ${{ steps.unit.outcome == 'success' || steps.unit.outcome == 'failure' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Run migrations
        run: npm run migrate
      - name: Unit tests
        id: unit
        run: npm run test:unit
      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-jest-unit
          path: allure-results/jest
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Integration tests
        run: npm run test:integration
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-jest-integration
          path: allure-results/jest
          if-no-files-found: ignore

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-and-unit
    outputs:
      node_env: ${{ steps.runtime_flags.outputs.node_env }}
      database_url: ${{ steps.runtime_flags.outputs.database_url }}
      node_version: ${{ steps.runtime_flags.outputs.node_version }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payments:payments@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run migrations
        run: npm run migrate
      - name: Build
        run: npm run build
      - name: Start server
        env:
          LOG_LEVEL: info
        run: |
          node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000/webhooks/config --timeout 60000
      - name: Verify runtime flags
        id: runtime_flags
        run: |
          RUNTIME_ENV=$(tr '\0' '\n' < /proc/$(cat server.pid)/environ)
          NODE_ENV_RT=$(sed -n 's/^NODE_ENV=//p' <<< "$RUNTIME_ENV")
          DB_RT=$(sed -n 's/^DATABASE_URL=//p' <<< "$RUNTIME_ENV")
          DB_SAFE=$(sed -E 's#^[a-z]+://([^@]*@)?##' <<< "$DB_RT")
          echo "server NODE_ENV=$NODE_ENV_RT"
          echo "server DATABASE_URL=$DB_SAFE"
          echo "node_env=$NODE_ENV_RT" >> "$GITHUB_OUTPUT"
          echo "database_url=$DB_SAFE" >> "$GITHUB_OUTPUT"
          echo "node_version=$(node -v)" >> "$GITHUB_OUTPUT"
          if [ "$NODE_ENV_RT" != "test" ]; then
            echo "::error::Server is running with NODE_ENV='$NODE_ENV_RT', expected 'test'"
            exit 1
          fi
          if [[ "$DB_RT" != */payments_test ]]; then
            echo "::error::Server DATABASE_URL '$DB_SAFE' is not the payments_test database"
            exit 1
          fi
      - name: E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Server logs on failure
        if: failure()
        run: cat server.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-playwright
          path: allure-results/playwright
          if-no-files-found: ignore

  report:
    name: Allure report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-and-unit, integration, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download jest results
        uses: actions/download-artifact@v7
        with:
          pattern: allure-jest-*
          path: allure-results/jest
          merge-multiple: true
        continue-on-error: true
      - name: Download E2E results
        uses: actions/download-artifact@v7
        with:
          pattern: allure-playwright
          path: allure-results/playwright
          merge-multiple: true
        continue-on-error: true
      - name: Write Allure environment
        run: |
          mkdir -p allure-results/jest allure-results/playwright
          cat > allure-results/jest/environment.properties <<EOF
          Run.Trigger=${{ github.event_name }}
          Run.Id=${{ github.run_id }}
          Commit=${{ github.sha }}
          Branch=${{ github.ref_name }}
          Server.NODE_ENV=${{ needs.e2e.outputs.node_env || 'not captured' }}
          Server.Database=${{ needs.e2e.outputs.database_url || 'not captured' }}
          Server.Node=${{ needs.e2e.outputs.node_version || 'not captured' }}
          EOF
          cat allure-results/jest/environment.properties
      - name: Generate Allure report
        run: npm run report:generate
      - name: Upload Allure report
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore

  publish-report:
    name: Publish Allure report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-and-unit, report]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build-and-unit.outputs.tests_ran == 'true' && needs.report.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: allure-report
          path: site
      - name: Refuse to publish an empty report
        run: |
          total=$(jq -r '.stats.total // 0' site/summary.json)
          echo "report contains $total tests"
          if [ "$total" -lt 1 ]; then echo "::error::Allure report has no test results; keeping the previously published report"; exit 1; fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false
      - name: Post report URL to summary
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          echo "### Allure report: [$PAGES_URL]($PAGES_URL)" >> "$GITHUB_STEP_SUMMARY"
